<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Insurance Application</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
  background: #f4f6f9;
  font-family: "Segoe UI", sans-serif;
}

.main-title {
  text-align: center;
  color: #2a6ebb;
  font-weight: 600;
  margin: 20px 0;
}

.form-card, .table-card {
  background: #fff;
  border-radius: 10px;
  padding: 25px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  margin-bottom: 25px;
}

.section-title {
  color: #2a6ebb;
  font-weight: 600;
  margin-bottom: 20px;
}

.form-row {
  display: flex;
  gap: 20px;
  margin-bottom: 15px;
}

.form-group {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.full-width {
  width: 100%;
}

label {
  font-weight: 600;
}

.mandatory {
  color: red;
}

input, select, textarea {
  border-radius: 6px;
  border: 1px solid #ccc;
  padding: 8px;
}

textarea {
  height: 80px;
}

.button-group {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.submit-btn {
  background: #2a6ebb;
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 6px;
}

.clear-btn {
  background: #888;
  color: white;
  border: none;
  padding: 8px 18px;
  border-radius: 6px;
}

/* FORCE table header color */
.table thead tr th {
  background: linear-gradient(90deg, #2a6ebb, #1e5aa5) !important;
  color: white !important;
  text-align: center;
}

/* Optional: rounded header look */
.table thead tr th:first-child {
  border-top-left-radius: 8px;
}

.table thead tr th:last-child {
  border-top-right-radius: 8px;
}

.table td, .table th {
  text-align: center;
}

.btn-edit {
  background: #2a6ebb;
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 5px;
}

.btn-delete {
  background: #e74c3c;
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="container">

  <h2 class="main-title">Crop Insurance Application System</h2>

  <!-- FORM -->
  <div class="form-card">

    <h4 class="section-title">Apply for Crop Insurance</h4>

    <form id="farmerForm">

      <div class="form-row">
        <div class="form-group">
          <label>Season <span class="mandatory">*</span></label>
          <select id="season"></select>
        </div>

        <div class="form-group">
          <label>Crop <span class="mandatory">*</span></label>
          <select id="crop"></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Farmer Name <span class="mandatory">*</span></label>
          <input type="text" id="name">
        </div>

        <div class="form-group">
          <label>Aadhar Number <span class="mandatory">*</span></label>
          <input type="text" id="aadhaar" maxlength="12">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Father Name <span class="mandatory">*</span></label>
          <input type="text" id="father">
        </div>

        <div class="form-group">
          <label>Category <span class="mandatory">*</span></label>
          <select id="category">
            <option value="">Select</option>
            <option value="SMALL">Small</option>
            <option value="MEDIUM">Medium</option>
            <option value="LARGE">Large</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width">
        <label>Address <span class="mandatory">*</span></label>
        <textarea id="address"></textarea>
      </div>

      <div class="button-group">
        <button type="submit" class="submit-btn">Submit</button>
        <button type="button" class="clear-btn" onclick="clearForm()">Clear</button>
      </div>

    </form>
  </div>

  <!-- TABLE -->
  <div class="table-card">

    <h4 class="section-title">Applied Farmers</h4>

    <table class="table table-bordered">
      <thead>
        <tr >
          <th>Name</th>
          <th>Aadhar</th>
          <th>Father</th>
          <th>Season</th>
          <th>Crop</th>
          <th>Category</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="farmerTable"></tbody>
    </table>

  </div>

</div>

<script>

const baseUrl = "http://localhost:8098/c/api";
let editId = null;

// LOAD SEASONS
function loadSeasons(){
  $.get(baseUrl + "/getAllSeason", function(data){
    $("#season").html('<option value="">Select</option>');
    data.forEach(s=>{
      $("#season").append(`<option value="${s.seasonId}">${s.seasonName}</option>`);
    });
  });
}

// LOAD CROPS
$("#season").change(function(){
  let id = $(this).val();
  $("#crop").html('<option value="">Select</option>');

  if(!id) return;

  $.get(baseUrl + "/getCropBySeason?seasonId=" + id, function(data){
    data.forEach(c=>{
      $("#crop").append(`<option value="${c.cropId}">${c.cropName}</option>`);
    });
  });
});

// SAVE / UPDATE
$("#farmerForm").submit(function(e){
  e.preventDefault();

  const data = {
    name: $("#name").val(),
    aadharNumber: $("#aadhaar").val(),
    fatherName: $("#father").val(),
    address: $("#address").val(),
    category: $("#category").val(),
    season: { seasonId: $("#season").val() },
    crop: { cropId: $("#crop").val() }
  };

  if(editId){
    $.ajax({
      url: baseUrl + "/" + editId,
      method: "PUT",
      contentType: "application/json",
      data: JSON.stringify(data),
      success: function(){
        alert("Updated Successfully");
        editId = null;
        loadFarmers();
        clearForm();
      }
    });
  } else {
    $.ajax({
      url: baseUrl + "/save",
      method: "POST",
      contentType: "application/json",
      data: JSON.stringify(data),
      success: function(){
        alert("Saved Successfully");
        loadFarmers();
        clearForm();
      }
    });
  }
});

// LOAD FARMERS
function loadFarmers(){
  $.get(baseUrl + "/getAll", function(data){
    let html = "";

    data.forEach(f=>{
      html += `
        <tr>
          <td>${f.name}</td>
          <td>${f.aadharNumber}</td>
          <td>${f.fatherName}</td>
          <td>${f.season ? f.season.seasonName : ''}</td>
          <td>${f.crop ? f.crop.cropName : ''}</td>
          <td>${f.category}</td>
          <td>
            <button class="btn-edit" onclick="editFarmer(${f.id})">Edit</button>
            <button class="btn-delete" onclick="deleteFarmer(${f.id})">Delete</button>
          </td>
        </tr>
      `;
    });

    $("#farmerTable").html(html);
  });
}

// DELETE
function deleteFarmer(id){
  $.ajax({
    url: baseUrl + "/" + id,
    method: "DELETE",
    success: function(){
      loadFarmers();
    }
  });
}

// EDIT
function editFarmer(id){
  $.get(baseUrl + "/getAll", function(data){
    const f = data.find(x => x.id === id);

    $("#name").val(f.name);
    $("#aadhaar").val(f.aadharNumber);
    $("#father").val(f.fatherName);
    $("#address").val(f.address);
    $("#category").val(f.category);

    $("#season").val(f.season.seasonId).change();

    setTimeout(()=>{
      $("#crop").val(f.crop.cropId);
    }, 300);

    editId = id;
  });
}

// CLEAR
function clearForm(){
  $("#farmerForm")[0].reset();
  editId = null;
}

// INIT
$(document).ready(function(){
  loadSeasons();
  loadFarmers();
});

</script>

</body>
</html>
